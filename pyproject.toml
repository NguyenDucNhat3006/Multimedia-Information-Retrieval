[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs336-video-retrieval"
version = "1.0.0"
description = "Hệ thống truy vấn sự kiện video CS336"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4", "numpy==2.2.5", "Pillow==11.2.1", "av==16.0.1", "httpx==0.28.1", "python-multipart==0.0.20", "psutil==7.0.0"]

[project.optional-dependencies]
visual = ["torch==2.7.0", "torchvision==0.22.0", "open-clip-torch==2.32.0"]
ocr = ["pytesseract==0.3.13"]
asr = ["faster-whisper==1.1.1"]
test = ["pytest==8.3.5", "ruff==0.11.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
